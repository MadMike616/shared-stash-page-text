# Shared Stash Page Text
# Set page_count to the Shared stash page count (1-1000).
# window_x/window_y are offsets from the normalized anchor point.
# window_width/window_height use D2R UI coordinates.
# font_size uses D2R UI coordinates and scales with the game window (8-96).
# font accepts a D2R fontFace/file name or a Windows font family name.
config_version = 1
page_count = 1000
current_page = 1
shared_tab_selected = true

window_x = 604
window_y = 20
window_width = 226
window_height = 38
font = "exocet"
font_size = 38
anchor_x = 0.000
anchor_y = 0.000

